<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sharon Chen — Photography</title>
<meta name="description" content="Photographs by Sharon Chen: night skies, wildlife and cities, from Taipei to Yosemite." />
<meta property="og:title" content="Sharon Chen — Photography" />
<meta property="og:description" content="Photographs by Sharon Chen: night skies, wildlife and cities, from Taipei to Yosemite." />
<meta property="og:image" content="photos/san-diego-yosemite/07.jpg" />
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header wrap">
  <a class="wordmark" href="index.html">Sharon Chen</a>
  <nav class="site-nav" aria-label="Main">
    <a href="photos.html">Collections</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>
  <section class="wrap" aria-label="Featured photographs">
    <div class="hero" id="hero">
      <div id="hero-slides"></div>
    </div>
    <div class="hero-caption">
      <div class="hero-caption-text" aria-live="polite">
        <span class="hero-title" id="hero-title"></span>
        <span class="hero-place" id="hero-place"></span>
      </div>
      <div class="hero-controls">
        <button type="button" id="hero-prev" aria-label="Previous photo">&larr;</button>
        <span id="hero-count"></span>
        <button type="button" id="hero-next" aria-label="Next photo">&rarr;</button>
      </div>
    </div>
  </section>

  <section class="statement wrap">
    <p>Night skies, wildlife and city streets, photographed between Taipei, Japan and the American West.</p>
    <a class="text-link" href="photos.html">Browse the collections</a>
  </section>

  <section class="section wrap" aria-labelledby="selected-heading">
    <div class="section-head">
      <h2 id="selected-heading">Selected work</h2>
    </div>
    <div class="justified" id="selected-grid"></div>
  </section>

  <section class="section wrap" aria-labelledby="collections-heading">
    <div class="section-head">
      <h2 id="collections-heading">Collections</h2>
      <a href="photos.html">View all</a>
    </div>
    <div class="collections" id="home-collections"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <span>&copy; <span id="year"></span> Sharon Chen. All photographs by the author.</span>
    <a href="mailto:sch312413@gmail.com">sch312413@gmail.com</a>
  </div>
</footer>

<!-- Full-screen viewer, shared by every gallery (js/gallery.js) -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <div class="viewer-top">
    <span class="viewer-count" id="viewer-count"></span>
    <button type="button" id="viewer-close">Close</button>
  </div>
  <div class="viewer-stage">
    <img class="viewer-photo" id="viewer-photo" alt="" />
    <button type="button" class="viewer-prev" id="viewer-prev" aria-label="Previous photo"><span aria-hidden="true">&larr;</span></button>
    <button type="button" class="viewer-next" id="viewer-next" aria-label="Next photo"><span aria-hidden="true">&rarr;</span></button>
  </div>
  <div class="viewer-bottom">
    <div class="viewer-caption">
      <span class="viewer-title" id="viewer-title"></span>
      <span class="viewer-place" id="viewer-place"></span>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/gallery.js"></script>
<script src="js/main.js"></script>
</body>
</html>
